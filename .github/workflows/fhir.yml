name: HAPI FHIR synthetic validation
on:
  workflow_dispatch:
  push:
    paths: ['clinical/fhir/**','scripts/export-fhir-fixtures.mjs','src/app.js','.github/workflows/fhir.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: node scripts/export-fhir-fixtures.mjs
      - run: mvn -B -f clinical/fhir/pom.xml test
