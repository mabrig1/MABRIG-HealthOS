name: MONAI synthetic training
on:
  workflow_dispatch:
  push:
    paths: ['imaging/train_synthetic.py','imaging/test_training.py','imaging/requirements.txt','.github/workflows/compute.yml']
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r imaging/requirements.txt
      - run: python -m imaging.train_synthetic
      - run: python -m unittest imaging.test_training
      - uses: actions/upload-artifact@v4
        with:
          name: monai-training-report
          path: monai-training-report.json
